[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade,
# B = flake8-bugbear, C4 = flake8-comprehensions, SIM = flake8-simplify,
# PTH = flake8-use-pathlib (enforces Path over os.path),
# PERF = perflint, RUF = ruff-specific rules.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PTH", "PERF", "RUF"]
ignore = [
    "E501",   # line-too-long — black/ruff-format handles this
    "SIM108", # ternary operator — less readable in complex conditions
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and may import private helpers directly.
"scripts/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
