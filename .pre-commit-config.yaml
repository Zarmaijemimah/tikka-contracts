repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-merge-labels
        name: check bare branch labels
        entry: python3 scripts/check_merge_labels.py
        language: system
        pass_filenames: false
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
      - id: check-orphan-modules
        name: check orphan modules
        entry: python3 scripts/check_orphan_modules.py
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: ruff lint
        entry: ruff check scripts/
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: ruff format --check scripts/
        language: system
        pass_filenames: false
        types: [python]
      - id: check-duplicate-items
        name: check duplicate Rust items
        entry: python3 scripts/check_duplicate_items.py
        language: system
        pass_filenames: false
      - id: prettier-oracle
        name: prettier oracle
        entry: bash -lc 'cd oracle && npx prettier --check "**/*.{js,jsx,ts,tsx,json,md}"'
        language: system
        pass_filenames: false
      - id: eslint-oracle
        name: eslint oracle
        entry: bash -lc 'cd oracle && npm run lint'
        language: system
        pass_filenames: false
