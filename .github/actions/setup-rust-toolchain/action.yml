name: Set up pinned Rust toolchain
description: >
  Installs the Rust toolchain channel declared in rust-toolchain.toml —
  the single source of truth for the compiler used by CI (issues #841, #843).
  Every Rust job must use this action instead of dtolnay/rust-toolchain or
  any other hard-coded toolchain reference.

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install "$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)"
        rustup show
