name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  schedule:
    # Weekly advisory database refresh (Mondays 06:00 UTC)
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml is the single source of truth for the compiler
      # version, components and WASM target (issues #841, #843).
      - name: Set up pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Rust Cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - run: cargo check --workspace --all-targets --all-features

  build_and_test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # rust-toolchain.toml is the single source of truth for the compiler
    # version, components and WASM target (issues #841, #843).
    - name: Set up pinned Rust toolchain
      uses: ./.github/actions/setup-rust

    - name: Rust Cache
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

    - name: Check for Orphaned Modules
      run: python3 scripts/check_orphan_modules.py

    - name: Cargo Check (fast compile gate)
      run: make check

    - name: Check Formatting
      run: make fmt-check

    - name: Check for Orphaned Modules
      run: make orphan-check

    - name: Check Doc Links
      run: python3 scripts/check_doc_links.py
    - name: Check Error Code Catalog
      run: python3 scripts/check_error_codes.py

    # Build through the Stellar CLI so CI produces the same artifacts the deploy
    # scripts upload — previously CI built wasm32-unknown-unknown while
    # deploy-testnet.sh deployed wasm32v1-none (issue #841).
    - name: Set up Stellar CLI
      uses: ./.github/actions/setup-stellar-cli

    - name: Build Contracts
      run: make build

    - name: Check WASM Binary Size (128KB limit + baseline delta)
      run: make wasm-size

    - name: Report WASM size delta on PR
      if: github.event_name == 'pull_request'
      run: |
        make wasm-size
        if [ -f /tmp/wasm-size-report.txt ]; then
          {
            echo "### WASM size report"
            echo '```'
            cat /tmp/wasm-size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
      env:
        WASM_SIZE_REPORT: /tmp/wasm-size-report.txt

    - name: Check Error Docs Sync
      run: make docs-errors
      run: |
        python3 scripts/generate_error_docs.py
        git diff --exit-code docs/ERRORS.md || (echo "ERROR: docs/ERRORS.md is out of sync with ProtocolError in contracts/raffle-shared/src/errors.rs. Run 'python3 scripts/generate_error_docs.py' to update." && exit 1)

    - name: Check Events Docs Sync
      run: make docs-events

    - name: Run Linter (Clippy)
      run: make clippy

    - name: Run Tests
      run: make test

    - name: Run Documentation Tests
      run: make test-doc

  shellcheck:
    name: Shell Script Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: make shellcheck
      - name: Test deployment helpers
        run: bash scripts/tests/test_common.sh

  oracle_check:
    name: Oracle Service CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: oracle/package-lock.json
      - name: Install dependencies
        timeout-minutes: 5
        run: cd oracle && npm ci
      - name: Check formatting (Prettier)
        run: make oracle-fmt-check
      - name: Lint (ESLint)
        run: make oracle-lint
      - name: TypeScript compile check
        run: make oracle-typecheck
      - name: Run tests
        run: make oracle-test-ci

      - name: Upload Oracle coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oracle-coverage-lcov
          path: oracle/coverage/lcov.info

  coverage:
    name: Rust Coverage + Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml is the single source of truth for the compiler
      # version (issue #1013) — the coverage job must measure the same
      # toolchain that CI builds and tests with.
      - name: Set up pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Rust Cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov

      - name: Collect code coverage (lcov)
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage-lcov
          path: coverage/lcov.info

      - name: Check coverage ratchet
        run: python3 scripts/check_coverage_ratchet.py --lcov coverage/lcov.info --baseline coverage/coverage-ratchet.json
