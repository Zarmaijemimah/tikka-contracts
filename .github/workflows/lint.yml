name: Lint Workflows

on:
  push:
    paths: [ '.github/workflows/**', 'contracts/**/*.rs', 'scripts/**' ]
  pull_request:
    paths: [ '.github/workflows/**', 'contracts/**/*.rs', 'scripts/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-artefacts:
    name: Conflict markers and branch labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for conflict markers and bare branch labels
        run: python3 scripts/check_merge_labels.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_CHECKSUM: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          bash <(curl -s --retry 3 https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest
          ./actionlint -color .github/workflows/*.yml

      - name: Detect orphaned .rs files
        run: python3 scripts/check_orphan_modules.py

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Ruff lint
        run: make ruff-lint

      - name: Ruff format check
        run: make ruff-fmt-check

      - name: Python script tests
        run: make python-tests
